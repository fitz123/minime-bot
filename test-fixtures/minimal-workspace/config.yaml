agents:
  main:
    workspaceCwd: ./agent-workspace
    model: gpt-5.5
    askAgent:
      enabled: true
      canAsk:
        - helper
  helper:
    workspaceCwd: ./helper-workspace
    model: gpt-5.5-mini
    askAgent:
      enabled: true
      deny:
        - "*"
telegramTokenEnv: MINIME_FIXTURE_TELEGRAM_TOKEN
# Deliberately absent so workspace validation exercises its non-fatal voice warning.
whisperModel: /nonexistent/minime-bot/fixture-whisper-model.bin
# Optional for interactive bot Pi RPC sessions only. Keep entries generic,
# absolute, and operator-approved.
# piExtraExtensions:
#   - /opt/minime/pi-extensions/approved-extension.ts
# Optional private-topic presentation, disabled unless explicitly configured.
# These are synthetic example identities; substitute the intended bot and peers.
# collaboration:
#   socketPath: /tmp/minime-collaboration/router.sock
# privateTopics:
#   expectedBotId: 900
#   chatIds: [100]
#   maxNameGraphemes: 17
bindings:
  - chatId: 111
    agentId: main
    kind: dm
